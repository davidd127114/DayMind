name: Device build (unsigned IPA)
# Produces an UNSIGNED .ipa for a real iPhone. It must be signed on the user's own computer with
# a sideloading tool (Sideloadly / AltStore) using the user's Apple ID, or re-signed in Xcode.
on:
  workflow_dispatch:

jobs:
  ipa:
    name: Build unsigned iOS device IPA
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS device (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project DayMind.xcodeproj -scheme DayMind -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee device-build.log | grep -E "error:|BUILD|\*\* " || true
          grep -q "BUILD SUCCEEDED" device-build.log || { grep -E "error:" device-build.log | sort -u | head -60; exit 1; }
      - name: Ad-hoc sign (gives the binaries a signature and entitlements that sideloading tools can replace)
        run: |
          APP=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "DayMind.app" | head -1)
          test -d "$APP" || { echo "DayMind.app not found"; exit 1; }
          # Strip capabilities a free Apple ID cannot sign (push, iCloud) from the app's Info.plist.
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$APP/Info.plist" || true
          cat > /tmp/ent.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>application-identifier</key><string>TEAMID.com.dabkowski.DayMind</string>
            <key>get-task-allow</key><true/>
          </dict></plist>
          EOF
          for ext in "$APP"/PlugIns/*.appex; do
            [ -d "$ext" ] && codesign --force --sign - --entitlements /tmp/ent.plist "$ext"
          done
          codesign --force --sign - --entitlements /tmp/ent.plist "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -E "Identifier|Signature|TeamIdentifier" || true
      - name: Package IPA
        run: |
          APP=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "DayMind.app" | head -1)
          test -d "$APP" || { echo "DayMind.app not found"; exit 1; }
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../DayMind-unsigned.ipa Payload)
          ls -la DayMind-unsigned.ipa
          # A copy without the widget/control extension for tools that cannot sign extensions.
          rm -rf ipa2 && mkdir -p ipa2/Payload && cp -R "$APP" ipa2/Payload/
          rm -rf ipa2/Payload/DayMind.app/PlugIns ipa2/Payload/DayMind.app/Extensions
          codesign --force --sign - --entitlements /tmp/ent.plist ipa2/Payload/DayMind.app
          (cd ipa2 && zip -qry ../DayMind-unsigned-noextension.ipa Payload)
          ls -la DayMind-unsigned-noextension.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DayMind-unsigned-ipa
          path: |
            DayMind-unsigned.ipa
            DayMind-unsigned-noextension.ipa
            device-build.log
